[package]
name = "stash"
version = "0.5.1"
edition = "2024"
description = "A download manager (HTTP and BitTorrent) and macOS-style Downloads stack for Windows"
authors = ["Sandesh Pandey"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/frstycodes/stash"
readme = "README.md"
publish = false

[dependencies]
windows-core = "0.61"
windows-implement = "0.60"
windows-numerics = "0.2"
windows-registry = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
tray-icon = "0.21"
image = { version = "0.25", default-features = false, features = ["png"] }
# Download engine: one small tokio runtime off the UI thread runs HTTP and torrents.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Schannel (the Windows TLS stack) instead of rustls/aws-lc: smaller, no C toolchain.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream", "http2", "charset", "system-proxy"] }
librqbit = { version = "9.1", default-features = false }
# librqbit needs a SHA-1 backend; crypto-hash uses Windows CryptoAPI.
librqbit-core = { version = "9.1", default-features = false, features = ["sha1-crypto-hash"] }
sha1w = { package = "librqbit-sha1-wrapper", version = "9.1", default-features = false, features = ["sha1-crypto-hash"] }
percent-encoding = "2"
# checks downloaded updates against the release's SHA256SUMS.txt
sha2 = "0.10"

[dependencies.windows]
version = "0.61"
features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Numerics",
    "Graphics",
    "Graphics_DirectX",
    "Graphics_Effects",
    "System",
    "UI",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Graphics_Direct2D",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
strip = true
panic = "abort"

[build-dependencies]
embed-resource = "3.0.12"
