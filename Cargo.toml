[package]
name = "stash"
version = "0.2.0"
edition = "2024"
description = "A macOS-style Downloads stack for the Windows desktop (Windows Composition)"
authors = ["Sandesh Pandey"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/frstycodes/stash"
readme = "README.md"
publish = false

[dependencies]
windows-core = "0.61"
windows-implement = "0.60"
windows-numerics = "0.2"
windows-registry = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
tray-icon = "0.21"
image = { version = "0.25", default-features = false, features = ["png"] }

[dependencies.windows]
version = "0.61"
features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Numerics",
    "Graphics",
    "Graphics_DirectX",
    "System",
    "UI",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
strip = true
panic = "abort"

[build-dependencies]
embed-resource = "3.0.12"
