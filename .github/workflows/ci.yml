# Builds the app and the installer on every push and pull request, so a broken
# build (or installer) shows up before it's released.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      - name: Build app and installer
        shell: pwsh
        run: ./installer/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: stash-${{ github.sha }}
          path: |
            dist/*.exe
            target/release/stash.exe
          retention-days: 14
