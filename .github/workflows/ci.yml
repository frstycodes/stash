# Builds everything a release ships on every push and pull request (the installer, and
# the x64 + Arm64 Store bundle), so a broken build shows up before it's released.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      - name: Build app and installer
        shell: pwsh
        run: ./installer/build.ps1

      - name: Build the Store bundle (x64 + Arm64)
        shell: pwsh
        run: ./packaging/build-msix.ps1 -Arch x64,arm64

      - uses: actions/upload-artifact@v7
        with:
          name: stash-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.msixbundle
          retention-days: 14
