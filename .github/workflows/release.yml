# Publishes a GitHub release when a version tag (v1.2.3) is pushed: builds the app
# and installer, then attaches the installer and a portable exe.
# installer/release.ps1 bumps the version, tags and pushes in one go.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match Cargo.toml version $version" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      - name: Build app and installer
        shell: pwsh
        run: ./installer/build.ps1

      - name: Portable exe
        shell: pwsh
        run: Copy-Item target/release/stash.exe "dist/Stash-$env:VERSION-portable.exe"

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/Stash-Setup-$env:VERSION.exe" `
            "dist/Stash-$env:VERSION-portable.exe" `
            --title "Stash $env:VERSION" `
            --generate-notes
